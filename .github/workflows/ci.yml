name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: for file in js/*.js tools/*.mjs; do node --check "$file"; done
      - name: Validate data, map ids and i18n keys
        run: node tools/validate-data.mjs
